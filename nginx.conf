server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never emit absolute redirects (Traefik terminates TLS, nginx only sees http)
    absolute_redirect off;

    # Root
    location = / {
        try_files /index.html =404;
    }

    # Clean URLs: /about -> /about.html ; real .html files still work (no redirects)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Do not serve dotfiles or config/compose files from the web root
    location ~ /\. { deny all; }
    location ~* \.conf$ { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /Dockerfile { deny all; }
}
