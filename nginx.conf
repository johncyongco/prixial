server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never emit absolute redirects (Traefik terminates TLS, nginx only sees http)
    absolute_redirect off;

    # Homepage
    location = / {
        try_files /index.html =404;
    }

    # Clean section routes on the homepage (JS scrolls to the section)
    location = /solutions { try_files /index.html =404; }
    location = /system    { try_files /index.html =404; }
    location = /projects  { try_files /index.html =404; }
    location = /blog      { try_files /index.html =404; }
    location = /contact   { try_files /index.html =404; }

    # Clean section route on the Pyl AI page
    location = /how-pyl-works { try_files /pyl-ai.html =404; }

    # Pages: /about -> about.html, real .html files also work (no redirects)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Do not serve dotfiles or config/compose files from the web root
    location ~ /\. { deny all; }
    location ~* \.conf$ { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /Dockerfile { deny all; }
}
